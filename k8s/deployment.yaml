apiVersion: apps/v1
kind: Deployment
metadata:
  name: juntos-alpha
  labels:
    app: juntos-alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: juntos-alpha
  template:
    metadata:
      labels:
        app: juntos-alpha
    spec:
      containers:
      - name: app
        image: gcr.io/PROJECT_ID/juntos-alpha:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: SERVER_ADDRESS
          value: "0.0.0.0"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
