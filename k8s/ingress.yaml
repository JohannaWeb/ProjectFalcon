apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: juntos-alpha
  namespace: juntos
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "gce"
    # GCE health check configuration
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"ports": {"80":"juntos-backend-config"}}'
spec:
  tls:
  - hosts:
    - 34.160.170.172.nip.io
    secretName: juntos-alpha-tls
  rules:
  - host: 34.160.170.172.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: juntos-alpha
            port:
              number: 80
