apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: juntos-alpha
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "gce"
spec:
  tls:
  - hosts:
    - projectfalcon.example.com  # UPDATE THIS
    secretName: juntos-alpha-tls
  rules:
  - host: projectfalcon.example.com  # UPDATE THIS
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: juntos-alpha
            port:
              number: 80
