# Quarkus Configuration - Juntos Alpha
quarkus.application.name=juntos-alpha
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Database Configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:juntosdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=password
quarkus.hibernate-orm.database.generation=create-drop
quarkus.hibernate-orm.log.sql=false

# Logging
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."app.juntos".level=DEBUG

# Metrics & Health
quarkus.micrometer.enabled=true
quarkus.micrometer.binder-enabled-default=true
quarkus.smallrye-health.enabled=true

# Metrics Tags
quarkus.micrometer.tags.application=${quarkus.application.name}
quarkus.micrometer.tags.environment=${RAILWAY_ENVIRONMENT_NAME:local}

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=https://*.vercel.app,https://*.railway.app,http://localhost:*,https://juntos.chat,https://www.juntos.chat,https://34.160.170.172.nip.io
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,Access-Control-Request-Method,Access-Control-Request-Headers
quarkus.http.cors.exposed-headers=Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=3600
